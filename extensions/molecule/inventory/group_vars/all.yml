---
# Shared test variables for all Molecule scenarios
# These variables are used across all test nodes

# Java configuration
java_version: "17"
java_install_method: "package"

# Root CA configuration
rootca_common_name: "Kafka Test CA"
rootca_organization: "Kafka Ansible Collection"
rootca_country: "US"
rootca_state: "California"
rootca_locality: "San Francisco"
rootca_cert_path: "/opt/kafka-ca"
rootca_key_size: 4096
rootca_validity_days: 3650

# TLS configuration (shared across roles)
tls_enabled: true
tls_keystore_password: "changeit"
tls_truststore_password: "changeit"
tls_key_password: "changeit"

# ZooKeeper configuration
zookeeper_version: "3.9.3"
zookeeper_user: "zookeeper"
zookeeper_group: "zookeeper"
zookeeper_install_dir: "/opt/zookeeper"
zookeeper_data_dir: "/var/lib/zookeeper"
zookeeper_log_dir: "/var/log/zookeeper"
zookeeper_client_port: 2181
zookeeper_peer_port: 2888
zookeeper_election_port: 3888
zookeeper_cluster_nodes:
  - zk1
  - zk2
  - zk3
zookeeper_tls_enabled: true

# Kafka configuration
kafka_version: "3.7.0"
kafka_scala_version: "2.13"
kafka_user: "kafka"
kafka_group: "kafka"
kafka_install_dir: "/opt/kafka"
kafka_data_dir: "/var/lib/kafka"
kafka_log_dir: "/var/log/kafka"
kafka_plaintext_port: 9092
kafka_ssl_port: 9093
kafka_tls_enabled: true
kafka_listeners: "PLAINTEXT://:9092,SSL://:9093"
kafka_advertised_listeners: "PLAINTEXT://{{ inventory_hostname }}:9092,SSL://{{ inventory_hostname }}:9093"
kafka_inter_broker_listener_name: "SSL"
kafka_zookeeper_connect: "zk1:2281,zk2:2281,zk3:2281"

# Common configuration
common_packages:
  - wget
  - curl
  - tar
  - nc
  - net-tools
  - procps

# JMX Exporter
jmx_exporter_version: "1.0.1"
jmx_exporter_install_dir: "/opt/jmx-exporter"
jmx_exporter_kafka_port: 7071
jmx_exporter_zookeeper_port: 7072
kafka_jmx_exporter_enabled: true
zookeeper_jmx_exporter_enabled: true
zookeeper_mntr_exporter_enabled: true

# Monitoring
grafana_admin_password: "admin"
kafka_exporter_version: "1.9.0"

# Nginx
nginx_basic_auth_user: "admin"
nginx_basic_auth_password: "admin"

# Traffic generator
traffic_bootstrap_servers: "kafka1:9092,kafka2:9092,kafka3:9092"
traffic_produce_interval: 2
traffic_consume_interval: 5

# System limits
common_ulimits:
  - domain: "{{ kafka_user | default('kafka') }}"
    limit_type: soft
    limit_item: nofile
    value: 65536
  - domain: "{{ kafka_user | default('kafka') }}"
    limit_type: hard
    limit_item: nofile
    value: 65536
  - domain: "{{ zookeeper_user | default('zookeeper') }}"
    limit_type: soft
    limit_item: nofile
    value: 65536
  - domain: "{{ zookeeper_user | default('zookeeper') }}"
    limit_type: hard
    limit_item: nofile
    value: 65536
